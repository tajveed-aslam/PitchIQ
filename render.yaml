# Render Blueprint for the PitchIQ API. The video analysis runs inside the API (free plan: 0.1 CPU, 512 MB),
# so analyses take a few minutes and run one at a time. Secrets marked sync: false are entered in the dashboard.
services:
  - type: web
    name: pitchiq-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    # Same region as the Neon database (AWS us-east-2, Ohio) so API <-> DB calls stay fast.
    region: ohio
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false # postgresql://... connection string from Neon (database "pitchiq")
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGINS
        sync: false # both Vercel URLs, comma-separated (Lite and Main editions)
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: MAX_VIDEO_SECONDS
        value: "60"
      - key: MAX_VIDEO_SIDE
        value: "1280" # up to 720p (the data saver sends 480p); 1080p+ needs too much memory for 512 MB
      - key: SAMPLE_RUNS_PER_HOUR
        value: "3"
